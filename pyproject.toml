[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "saveharbor"
version = "0.1.3"
description = "Versioned content-addressed backups and verified restore to new destinations"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{name = "azaz2288"}]
dependencies = []
[project.scripts]
saveharbor = "saveharbor.__main__:main"
[tool.setuptools.packages.find]
include = ["saveharbor*"]
